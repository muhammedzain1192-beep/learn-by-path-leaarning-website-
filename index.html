<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Z-Learn — Modern Academic Learning Platform | JEE Main, Advanced, BITSAT, Kerala Plus Two</title>
  <meta name="description" content="Z-Learn is a personal learning platform for Class 11 & 12 students preparing for JEE Main, JEE Advanced, VITEEE, BITSAT, MET, and Kerala Plus Two. Organize YouTube lectures into structured curriculums with questions, PYQs, and CBT mock tests." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Design System & Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body>
  <div id="app">
    <!-- Backdrop for mobile drawer -->
    <div class="sidebar-backdrop"></div>

    <!-- Collapsible Desktop & Drawer Sidebar -->
    <nav id="sidebar" aria-label="Main Navigation"></nav>

    <!-- Main Viewport Area -->
    <div id="main-wrapper">
      <!-- App Header Bar with Global Search -->
      <header id="header" role="banner"></header>

      <!-- Active Page Dynamic Viewport -->
      <main id="view-container" role="main"></main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav id="bottom-nav" aria-label="Mobile Bottom Navigation">
      <a href="#dashboard" class="bottom-nav-item active" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="#courses" class="bottom-nav-item" id="nav-learn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <span>Learn</span>
      </a>
      <a href="#practice" class="bottom-nav-item" id="nav-practice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Practice</span>
      </a>
      <a href="#mock-tests" class="bottom-nav-item" id="nav-tests">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>Tests</span>
      </a>
      <a href="#profile" class="bottom-nav-item" id="nav-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- Dynamic Modal Containers -->
  <div id="search-modal-container"></div>
  <div id="admin-modal-container"></div>
  <div id="toast-container"></div>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
